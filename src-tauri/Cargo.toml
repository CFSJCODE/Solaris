[package]
name = "solaris"
version = "0.5.5"
description = "Solaris — Plataforma de IA pessoal"
authors = ["CFSJCODE"]
license = "MIT"
repository = "https://github.com/CFSJCODE/Solaris"
default-run = "solaris"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "solaris_lib"
crate-type = ["rlib"]

[[bin]]
name = "solaris"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# A janela Windows faz IPC; a inferência pesada fica no engine ONNX.
[profile.release.package.solaris]
opt-level = 1
codegen-units = 16
