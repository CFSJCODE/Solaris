# Ruff: formatador e linter do Python (equivalente ao Prettier/ESLint).
# Uso: python-engine\.venv\Scripts\python -m ruff format .  |  -m ruff check .
line-length = 100
# O worker de aprendizado roda no runtime separado (Python 3.10); o engine em 3.14.
target-version = "py310"
extend-exclude = ["**/.venv", "src-tauri/target", "storage", "models", "frontend"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint]
# Erros reais: sintaxe/runtime (E4, E7, E9), pyflakes (F) e ordem de imports (I).
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["app"]